<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Sokker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background: #f5f5f5;
    }

    .card {
        background: white;
        max-width: 500px;
        margin: auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,.1);
    }

    .status {
        font-size: 2rem;
        font-weight: bold;
        margin: 20px 0;
    }

    .online {
        color: green;
    }

    .offline {
        color: red;
    }

    .time {
        color: #666;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Monitor de Sokker.org</h1>

    <div id="status" class="status">
        Comprobando...
    </div>

    <div id="time" class="time"></div>
</div>

<script>
async function checkSite() {

    const statusElement = document.getElementById("status");
    const timeElement = document.getElementById("time");

    try {

        const response = await fetch(
            "https://api.allorigins.win/raw?url=" +
            encodeURIComponent("https://www.sokker.org")
        );

        if (response.ok) {
            statusElement.textContent = "✅ FUNCIONANDO";
            statusElement.className = "status online";
        } else {
            statusElement.textContent = "❌ CAÍDO";
            statusElement.className = "status offline";
        }

    } catch (error) {
        statusElement.textContent = "❌ CAÍDO";
        statusElement.className = "status offline";
    }

    timeElement.textContent =
        "Última comprobación: " +
        new Date().toLocaleString("es-ES");
}

checkSite();

setInterval(checkSite, 60000);
</script>

</body>
</html>
